name: Test platform
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      EMBEDDING_MODE: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      - run: python -m pytest -q
      - name: Live MCP acceptance
        shell: bash
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/platform.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/health && break || sleep 2; done
          python scripts/evaluate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-results
          path: docs/evaluation-results.json
