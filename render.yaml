# Initial portfolio demo: free compute, ephemeral local data, no disk/datastore.
services:
  - type: web
    name: enterprise-ai-knowledge-automation
    runtime: docker
    repo: https://github.com/ehulsizer/enterprise-ai-knowledge-automation
    branch: main
    plan: free
    region: virginia
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: PORT
        value: '8000'
      - key: API_BASE_URL
        value: http://127.0.0.1:8000
      - key: APP_API_KEY
        generateValue: true
      - key: ENTERPRISE_API_KEY
        generateValue: true
      - key: EMBEDDING_MODE
        value: fastembed
      - key: QDRANT_PATH
        value: /app/data/qdrant
      - key: ENTERPRISE_DB_PATH
        value: /app/data/enterprise.sqlite3
      - key: MODEL_CACHE_PATH
        value: /app/data/models
      - key: EMBEDDING_THREADS
        value: '1'
      - key: MAX_CONCURRENT_QUERIES
        value: '1'
      - key: OMP_NUM_THREADS
        value: '1'
      - key: TOKENIZERS_PARALLELISM
        value: 'false'
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
